name: Fetch HDS-MS Images

on:
  workflow_dispatch:

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download official Hit-Air HDS-MS photos
        run: |
          mkdir -p public/product-details
          curl -sL -A "Mozilla/5.0" -o public/product-details/hdsms-main.jpg "https://www.hit-air.com/archives/005/202407/60560090ff03e573d853d04d8fb9a3f4.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/hdsms-back.jpg "https://www.hit-air.com/archives/005/202407/be76706cf7db871a107865b8a91a05cc.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/hdsms-keybox.jpg "https://www.hit-air.com/archives/005/202407/d2f1b860790db7bf1bbb14e80ffa052f.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/hdsms-keyboxcover.jpg "https://www.hit-air.com/archives/005/202407/349078635183fa5e63013fd72a493afe.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/hdsms-airbagstructure.jpg "https://www.hit-air.com/archives/005/201912/9117c2fb526b8e382a3e521e467486b1.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/hdsms-banner-details.jpg "https://www.hit-air.com/archives/005/202407/a6c0db50f1d18b5bda64f5518a2b61e7.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/hdsms-banner-function.jpg "https://www.hit-air.com/archives/005/202407/28b3e4dfd7aa4c600c3bc0c972c9f8da.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/hdsms-banner-airbag.jpg "https://www.hit-air.com/archives/005/202407/583c73b7c3337b7eff8f50c521434c5e.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/hdsms-banner-protector.jpg "https://www.hit-air.com/archives/005/202311/843261c997b02538d4b8d9fe24bbb337.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/hdsms-sizediagram.jpg "https://www.hit-air.com/archives/005/202401/a0bbdf823f89b5c25537965ea2320803.jpg"
          ls -la public/product-details/hdsms-*
          file public/product-details/hdsms-*
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/product-details/hdsms-*
          git commit -m "Add HDS-MS real product photos (official hit-air.com)" || echo "nothing to commit"
          git push
