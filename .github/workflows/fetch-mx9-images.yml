name: Fetch MX-9 Images

on:
  workflow_dispatch:

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Hit-Air MX-9 photos
        run: |
          mkdir -p public/product-details
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-main.jpg "https://www.hit-air.com/archives/005/202407/c0d1ecfd7bad3c9c2f9864247ffddab1.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-det2.jpg "https://www.hit-air.com/archives/005/202407/f5332d36d87b9c1e0643b68a29f678e9.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-det3.jpg "https://www.hit-air.com/archives/005/202407/298d1520210953034487a1638c48153f.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-det4.jpg "https://www.hit-air.com/archives/005/201912/6bf75730a8bdca8d894f7d571b9ed661.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-det5.jpg "https://www.hit-air.com/archives/005/202407/cd7673389f39167d43d56d6ab7588952.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-det6.jpg "https://www.hit-air.com/archives/005/202407/0ae26b82ab924cba38c10f97157e4a9a.jpg"
          ls -la public/product-details/mx9-*
          file public/product-details/mx9-*
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/product-details/mx9-*.jpg
          git commit -m "Add MX-9 real product photos (official hit-air.com)" || echo "nothing to commit"
          git push
