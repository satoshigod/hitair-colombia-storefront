name: Fetch MX-9 Images 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Hit-Air MX-9 photos (batch 2)
        run: |
          mkdir -p public/product-details
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-banner-details.jpg "https://www.hit-air.com/archives/005/202407/948f3ad2b3f8d922029c59b5089bfd6c.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-banner-function.jpg "https://www.hit-air.com/archives/005/202407/86fc9271b1d079d7c473423b1fbc8a7b.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-banner-airbag.jpg "https://www.hit-air.com/archives/005/202407/579758e1c2e1a243a75cd502cce54fa5.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-banner-protector.jpg "https://www.hit-air.com/archives/005/202311/7fdf44fd0f2b53e78e466da566269f1b.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-darkgray-front.jpg "https://www.hit-air.com/archives/005/202407/ab61c766351bfee0a9c3ea0cc00b4bb9.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-darkgray-back.jpg "https://www.hit-air.com/archives/005/202407/e0a0c5665a6d239234b567423a96348d.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-lightgray-front.jpg "https://www.hit-air.com/archives/005/202407/6db12ac5f75f0601696b4e5f65151751.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-lightgray-back.jpg "https://www.hit-air.com/archives/005/202407/9fa2042bb0d5ee772fda84d8af675eaf.jpg"
          curl -sL -A "Mozilla/5.0" -o public/product-details/mx9-airbag-inflated-back.jpg "https://www.hit-air.com/archives/005/202407/a9b2c1997fbcf8c85730362ca8fde486.jpg"
          ls -la public/product-details/mx9-*
          file public/product-details/mx9-*
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/product-details/mx9-*
          git commit -m "Add MX-9 banner + colorway photos (official hit-air.com)" || echo "nothing to commit"
          git push
